name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# allow the workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# let an in-flight deploy finish rather than cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # While the site is served from https://<user>.github.io/<repo>/ every
          # asset needs that subpath, or the browser requests /_next/... from the
          # domain root and the page renders unstyled.
          #
          # DELETE THIS `env:` BLOCK once openwearablesai.com points at Pages —
          # the apex domain serves from the root and the prefix breaks it.
          PAGES_BASE_PATH: /openwearablesai

      # enablement:true turns Pages on if it is ever off, rather than failing
      # the run the way the first deploy did
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
